# Optional workaround for NVIDIA Portal DMA-BUF flicker on Ubuntu/GNOME.
# Applies only to Sunshine. The desktop keeps its normal GPU renderer and
# Sunshine still uses NVENC; PipeWire capture takes the memory-buffer path.
[Service]
NoNewPrivileges=yes
Environment=__EGL_VENDOR_LIBRARY_FILENAMES=/usr/share/glvnd/egl_vendor.d/50_mesa.json
Environment=LIBGL_ALWAYS_SOFTWARE=1
